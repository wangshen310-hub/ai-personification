<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#536273"/>
    </marker>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#2f6fed"/>
    </marker>
    <style>
      .font { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 38px; font-weight: 800; fill: #152238; }
      .subtitle { font-size: 20px; fill: #59687a; }
      .heading { font-size: 23px; font-weight: 800; fill: #152238; }
      .body { font-size: 18px; fill: #3f4d5e; }
      .small { font-size: 15px; fill: #718094; }
      .label { font-size: 15px; font-weight: 700; fill: #2f6fed; }
      .number { font-size: 16px; font-weight: 800; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1500" height="820" fill="#ffffff"/>
  <circle cx="750" cy="405" r="280" fill="#f4f7fb"/>

  <g class="font">
    <text x="70" y="72" class="title">AI Personification</text>
    <text x="70" y="112" class="subtitle">独立运行时维护连续人格，模型负责理解情境与组织表达</text>

    <!-- Main flow cards -->
    <rect x="70" y="220" width="260" height="250" rx="28" fill="#fff7e8" stroke="#f0b44d" stroke-width="3"/>
    <text x="105" y="270" class="heading">用户与时间</text>
    <text x="105" y="314" class="body">聊天消息</text>
    <text x="105" y="348" class="body">暂停与回复</text>
    <text x="105" y="382" class="body">沉默与重要日期</text>
    <text x="105" y="430" class="small">所有输入先变成事件</text>

    <rect x="425" y="175" width="650" height="360" rx="34" fill="#eef5ff" stroke="#2f6fed" stroke-width="4"/>
    <text x="470" y="232" class="heading">Companion Runtime</text>
    <text x="470" y="264" class="small">独立软件：事实、状态和权限的唯一来源</text>

    <rect x="470" y="300" width="250" height="82" rx="18" fill="#ffffff" stroke="#9cb7df" stroke-width="2"/>
    <text x="495" y="335" class="heading">状态</text>
    <text x="495" y="362" class="small">需求 · 情绪 · 记忆 · 时钟</text>

    <rect x="780" y="300" width="250" height="82" rx="18" fill="#ffffff" stroke="#9cb7df" stroke-width="2"/>
    <text x="805" y="335" class="heading">策略</text>
    <text x="805" y="362" class="small">安全 · 限频 · 是否行动</text>

    <rect x="470" y="410" width="560" height="82" rx="18" fill="#ffffff" stroke="#9cb7df" stroke-width="2"/>
    <text x="495" y="445" class="heading">结果</text>
    <text x="495" y="472" class="small">发送 · 内部记录 · 等待 · 拒绝，并写入审计</text>

    <rect x="1170" y="220" width="260" height="250" rx="28" fill="#edf9f1" stroke="#54ad72" stroke-width="3"/>
    <text x="1205" y="270" class="heading">模型 API</text>
    <text x="1205" y="314" class="body">理解当前语境</text>
    <text x="1205" y="348" class="body">提出候选意图</text>
    <text x="1205" y="382" class="body">生成表达草稿</text>
    <text x="1205" y="430" class="small">不能直接改状态或发消息</text>

    <!-- Flow -->
    <circle cx="375" cy="345" r="19" fill="#f0a52b"/>
    <text x="375" y="351" text-anchor="middle" class="number">1</text>
    <path d="M330 345 L405 345" fill="none" stroke="#536273" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="367" y="322" text-anchor="middle" class="label">事件</text>

    <circle cx="1120" cy="345" r="19" fill="#2f6fed"/>
    <text x="1120" y="351" text-anchor="middle" class="number">2</text>
    <path d="M1075 320 L1150 320" fill="none" stroke="#2f6fed" stroke-width="4" marker-end="url(#blue-arrow)"/>
    <text x="1113" y="296" text-anchor="middle" class="label">上下文</text>
    <path d="M1150 405 L1075 405" fill="none" stroke="#2f6fed" stroke-width="4" marker-end="url(#blue-arrow)"/>
    <text x="1113" y="432" text-anchor="middle" class="label">候选</text>

    <circle cx="750" cy="590" r="19" fill="#2f6fed"/>
    <text x="750" y="596" text-anchor="middle" class="number">3</text>
    <path d="M750 535 L750 650" fill="none" stroke="#536273" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="775" y="610" class="label">策略决定</text>

    <!-- Outcome cards -->
    <rect x="420" y="665" width="210" height="78" rx="18" fill="#f4f7fb" stroke="#c5cfdb" stroke-width="2"/>
    <text x="455" y="700" class="heading">发送</text>
    <text x="455" y="725" class="small">仅限批准的消息</text>

    <rect x="645" y="665" width="210" height="78" rx="18" fill="#f4f7fb" stroke="#c5cfdb" stroke-width="2"/>
    <text x="680" y="700" class="heading">等待</text>
    <text x="680" y="725" class="small">保留用户空间</text>

    <rect x="870" y="665" width="210" height="78" rx="18" fill="#f4f7fb" stroke="#c5cfdb" stroke-width="2"/>
    <text x="905" y="700" class="heading">内部记录</text>
    <text x="905" y="725" class="small">不打扰用户</text>

    <!-- Footer -->
    <line x1="70" y1="780" x2="1430" y2="780" stroke="#d8e0e8" stroke-width="2"/>
    <text x="70" y="807" class="small">核心原则：模型提出建议，运行时做决定。</text>
    <text x="1430" y="807" text-anchor="end" class="small">Model suggests · Runtime decides</text>
  </g>
</svg>
