<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1430" viewBox="0 0 1200 1430" role="img" aria-labelledby="title desc">
  <title id="title">AI Personification 运行逻辑</title>
  <desc id="desc">从外部事件到人格内核、模型候选、策略决策、执行确认和状态反馈的完整运行闭环。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <marker id="feedbackArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #64748b; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #4338ca; letter-spacing: 1px; }
      .node-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #475569; text-anchor: middle; }
      .small-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #0f172a; text-anchor: middle; }
      .small-text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #475569; text-anchor: middle; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; fill: #64748b; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#feedbackArrow); }
    </style>
  </defs>

  <rect width="1200" height="1430" rx="28" fill="url(#background)"/>
  <text x="600" y="58" class="title" text-anchor="middle">AI Personification 运行逻辑</text>
  <text x="600" y="88" class="subtitle" text-anchor="middle">模型提出可能性 · 人格内核保存连续性 · 执行结果形成反馈</text>

  <rect x="350" y="125" width="500" height="82" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="158" class="node-title">外部输入</text>
  <text x="600" y="184" class="node-text">用户消息 · 时间推进 · 暂停 · 关系事件</text>

  <path d="M600 207 V245" class="flow"/>
  <rect x="350" y="247" width="500" height="82" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="280" class="node-title">不可变事件</text>
  <text x="600" y="306" class="node-text">唯一 ID · 时间 · 类型 · 数据；重复事件只处理一次</text>

  <path d="M600 329 V368" class="flow"/>
  <rect x="90" y="370" width="1020" height="280" rx="26" fill="url(#kernel)" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="407" class="section">模型外：持久人格内核</text>

  <rect x="125" y="438" width="205" height="126" rx="16" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="227" y="472" class="small-title">内在需求</text>
  <text x="227" y="500" class="small-text">联结 · 关怀 · 好奇</text>
  <text x="227" y="523" class="small-text">自主 · 一致性 · 节律</text>
  <text x="227" y="546" class="small-text">随时间和事件变化</text>

  <rect x="365" y="438" width="205" height="126" rx="16" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="467" y="472" class="small-title">情绪与心境</text>
  <text x="467" y="500" class="small-text">事件评价产生即时情绪</text>
  <text x="467" y="523" class="small-text">心境缓慢移动</text>
  <text x="467" y="546" class="small-text">不由模型随机选择</text>

  <rect x="605" y="438" width="205" height="126" rx="16" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="707" y="472" class="small-title">关系状态</text>
  <text x="707" y="500" class="small-text">熟悉度 · 信任</text>
  <text x="707" y="523" class="small-text">互惠 · 边界清晰度</text>
  <text x="707" y="546" class="small-text">由真实事件缓慢演化</text>

  <rect x="845" y="438" width="230" height="126" rx="16" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="960" y="472" class="small-title">稳定人格</text>
  <text x="960" y="500" class="small-text">名字 · 特质 · 价值观</text>
  <text x="960" y="523" class="small-text">表达风格 · 最近对话</text>
  <text x="960" y="546" class="small-text">跨模型与重启保持连续</text>

  <rect x="400" y="588" width="400" height="42" rx="12" fill="#4338ca"/>
  <text x="600" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">生成状态快照与有界上下文</text>

  <path d="M600 650 V690" class="flow"/>
  <rect x="235" y="692" width="730" height="100" rx="20" fill="url(#model)" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="730" class="node-title">LLM / Codex / Ollama</text>
  <text x="600" y="758" class="node-text">理解当前情境，生成结构化候选：回复 · 内部记录 · 等待 · 不行动</text>

  <path d="M600 792 V832" class="flow"/>
  <rect x="170" y="834" width="380" height="104" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="870" class="node-title">独立候选评价</text>
  <text x="360" y="897" class="node-text">根据真实历史计算重复度</text>
  <text x="360" y="920" class="node-text">校准最低打扰成本</text>

  <rect x="650" y="834" width="380" height="104" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="870" class="node-title">权限与边界检查</text>
  <text x="840" y="897" class="node-text">主动限制 · 用户暂停 · 工具权限</text>
  <text x="840" y="920" class="node-text">不合法候选淘汰并记录原因</text>
  <path d="M550 886 H648" class="flow"/>

  <path d="M840 938 V978" class="flow"/>
  <rect x="310" y="980" width="580" height="96" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="1016" class="node-title">策略选择</text>
  <text x="600" y="1044" class="node-text">需求缓解 + 关系价值 + 价值一致性 − 打扰 − 风险 − 重复</text>
  <text x="600" y="1065" class="small-text">所有候选都要与“不行动”比较</text>

  <path d="M600 1076 V1116" class="flow"/>
  <rect x="120" y="1118" width="290" height="92" rx="18" fill="url(#action)" stroke="#34d399" stroke-width="2"/>
  <text x="265" y="1153" class="node-title">回复</text>
  <text x="265" y="1181" class="node-text">交给消息通道展示或发送</text>
  <rect x="455" y="1118" width="290" height="92" rx="18" fill="url(#action)" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="1153" class="node-title">内部记录</text>
  <text x="600" y="1181" class="node-text">整理矛盾、承诺或思路</text>
  <rect x="790" y="1118" width="290" height="92" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="935" y="1153" class="node-title">等待 / 不行动</text>
  <text x="935" y="1181" class="node-text">保持沉默，不制造互动义务</text>
  <path d="M600 1076 L265 1116" class="flow"/>
  <path d="M600 1076 V1116" class="flow"/>
  <path d="M600 1076 L935 1116" class="flow"/>

  <path d="M265 1210 V1250 H490" class="flow"/>
  <path d="M600 1210 V1250" class="flow"/>
  <rect x="490" y="1230" width="220" height="74" rx="37" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="600" y="1260" class="node-title">执行确认</text>
  <text x="600" y="1284" class="small-text">实际发生才写入历史</text>

  <path d="M600 1304 V1344" class="feedback"/>
  <rect x="310" y="1346" width="580" height="62" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="600" y="1384" class="node-title">结果事件 → 更新需求、关系与最近对话</text>

  <path d="M310 1377 H55 V510 H88" class="feedback"/>
  <text x="72" y="955" class="label" transform="rotate(-90 72 955)">反馈形成下一轮人格状态</text>
</svg>
