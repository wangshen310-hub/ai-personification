<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2360" viewBox="0 0 900 2360" role="img" aria-labelledby="title desc">
  <title id="title">AI Personification 新版完整运行逻辑</title>
  <desc id="desc">深色 Mermaid 风格流程图：SQLite 事件、语义解释、持久人格、模型外动力、语言表达、策略仲裁、Outbox 与 action_id 送达确认形成长期闭环。</desc>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#a2a2a2"/></marker><style>.bg{fill:#000}.g{fill:#111;stroke:#272727}.n{fill:#1b1b1b;stroke:#444}.s{fill:#242424;stroke:#555}.d{fill:#1b1b1b;stroke:#444}.l{fill:none;stroke:#9b9b9b;stroke-width:1.2;marker-end:url(#a)}.ls{fill:none;stroke:#717171;stroke-width:1}.loop{fill:none;stroke:#777;stroke-width:1.1;stroke-dasharray:4 4;marker-end:url(#a)}.gl{fill:#777;font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}.t{fill:#d2d2d2;font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;text-anchor:middle}.sm{fill:#b7b7b7;font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;text-anchor:middle}.e{fill:#929292;font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;text-anchor:middle}</style></defs>
  <rect class="bg" width="900" height="2360"/>

  <rect class="s" x="300" y="45" width="300" height="66"/><text class="t" x="450" y="71"><tspan x="450">外部事件 / 后台 Worker</tspan><tspan class="sm" x="450" dy="22">用户消息 · 时间 · 暂停 · 通道反馈</tspan></text>
  <path class="l" d="M450 111V150"/><rect class="n" x="330" y="150" width="240" height="58"/><text class="t" x="450" y="175"><tspan x="450">SQLite WAL 事件事务</tspan><tspan class="sm" x="450" dy="20">event_id · 序列 CAS · 并发安全</tspan></text>
  <path class="l" d="M450 208V244"/><polygon class="d" points="450,244 522,282 450,320 378,282"/><text class="sm" x="450" y="278">事件是否已存在？</text><text class="e" x="350" y="270">是</text><text class="e" x="470" y="337">否</text>
  <path class="l" d="M378 282L246 334"/><rect class="n" x="76" y="308" width="170" height="52"/><text class="sm" x="161" y="339">返回幂等结果</text>

  <rect class="g" x="80" y="382" width="740" height="306"/><text class="gl" x="98" y="403">语义证据与持久状态</text>
  <path class="l" d="M450 320V426"/><rect class="n" x="326" y="426" width="248" height="56"/><text class="t" x="450" y="450"><tspan x="450">保守语义解释</tspan><tspan class="sm" x="450" dy="20">感谢 / 边界 / 冲突 / 修复 / 承诺</tspan></text>
  <rect class="n" x="104" y="510" width="182" height="60"/><text class="sm" x="195" y="535"><tspan x="195">证据记忆</tspan><tspan x="195" dy="19">来源 / 置信度 / 状态</tspan></text>
  <rect class="n" x="359" y="510" width="182" height="60"/><text class="sm" x="450" y="535"><tspan x="450">需求与互动负荷</tspan><tspan x="450" dy="19">时间与结构化事件更新</tspan></text>
  <rect class="n" x="614" y="510" width="182" height="60"/><text class="sm" x="705" y="535"><tspan x="705">关系与情绪</tspan><tspan x="705" dy="19">不按消息条数加信任</tspan></text>
  <path class="ls" d="M390 482L195 510M450 482V510M510 482L705 510"/>
  <path class="ls" d="M195 570L390 612M450 570V612M705 570L510 612"/><rect class="s" x="310" y="612" width="280" height="58"/><text class="t" x="450" y="637"><tspan x="450">持久人格状态快照</tspan><tspan class="sm" x="450" dy="20">身份 / 学习参数 / 关系 / 记忆</tspan></text>

  <rect class="g" x="80" y="720" width="740" height="320"/><text class="gl" x="98" y="741">模型外：原生动力与意图</text>
  <path class="l" d="M450 670V770"/><rect class="s" x="310" y="770" width="280" height="58"/><text class="t" x="450" y="795"><tspan x="450">计算需求压力与行动机会</tspan><tspan class="sm" x="450" dy="20">模型评分不能创造动机 · 内核先选意图</tspan></text>
  <path class="l" d="M385 828L175 884M430 828L355 884M470 828L545 884M515 828L725 884"/>
  <rect class="n" x="100" y="884" width="150" height="54"/><text class="sm" x="175" y="916">回应用户</text><rect class="n" x="280" y="884" width="150" height="54"/><text class="sm" x="355" y="916">主动联系</text><rect class="n" x="470" y="884" width="150" height="54"/><text class="sm" x="545" y="916">内部整理</text><rect class="n" x="650" y="884" width="150" height="54"/><text class="sm" x="725" y="916">等待 / 不行动</text>
  <path class="ls" d="M175 938L372 982M355 938L420 982M545 938L480 982M725 938L528 982"/><rect class="s" x="300" y="982" width="300" height="58"/><text class="t" x="450" y="1007"><tspan x="450">内核授权的意图集合</tspan><tspan class="sm" x="450" dy="20">零需求时不能凭模型自评主动发送</tspan></text>

  <rect class="g" x="80" y="1072" width="740" height="270"/><text class="gl" x="98" y="1093">语言实现器</text>
  <path class="l" d="M450 1040V1120"/><rect class="s" x="300" y="1120" width="300" height="62"/><text class="t" x="450" y="1146"><tspan x="450">LLM / Codex / Ollama</tspan><tspan class="sm" x="450" dy="21">只为一个已选意图生成表达草稿</tspan></text>
  <rect class="n" x="110" y="1215" width="185" height="60"/><text class="sm" x="202" y="1240"><tspan x="202">独立安全检查</tspan><tspan x="202" dy="19">模型不能自证安全</tspan></text><rect class="n" x="357" y="1215" width="185" height="60"/><text class="sm" x="450" y="1240"><tspan x="450">打扰成本校准</tspan><tspan x="450" dy="19">互动负荷 / 长度</tspan></text><rect class="n" x="604" y="1215" width="185" height="60"/><text class="sm" x="696" y="1240"><tspan x="696">重复度校准</tspan><tspan x="696" dy="19">已确认真实对话</tspan></text>
  <path class="l" d="M390 1182L202 1215M450 1182V1215M510 1182L696 1215"/>
  <path class="ls" d="M202 1275L390 1302M450 1275V1302M696 1275L510 1302"/><rect class="n" x="326" y="1302" width="248" height="40"/><text class="sm" x="450" y="1327">校准后的表达草稿</text>

  <rect class="g" x="80" y="1374" width="740" height="356"/><text class="gl" x="98" y="1395">策略仲裁</text>
  <path class="l" d="M450 1342V1422"/><rect class="s" x="286" y="1422" width="328" height="64"/><text class="t" x="450" y="1448"><tspan x="450">内核收益 + 关系适配 - 成本</tspan><tspan class="sm" x="450" dy="21">与等待和不行动共同比较</tspan></text>
  <rect class="n" x="105" y="1522" width="200" height="62"/><text class="sm" x="205" y="1547"><tspan x="205">硬边界</tspan><tspan x="205" dy="19">暂停 / 权限 / 安静时间</tspan></text><rect class="n" x="350" y="1522" width="200" height="62"/><text class="sm" x="450" y="1547"><tspan x="450">短期节奏</tspan><tspan x="450" dy="19">可配置 24h 上限</tspan></text><rect class="n" x="595" y="1522" width="200" height="62"/><text class="sm" x="695" y="1547"><tspan x="695">未回复降频</tspan><tspan x="695" dy="19">72h 冷却后重新评估</tspan></text>
  <path class="ls" d="M350 1486L205 1522M450 1486V1522M550 1486L695 1522"/><path class="l" d="M205 1584L382 1630M450 1584V1630M695 1584L518 1630"/>
  <polygon class="d" points="450,1610 520,1648 450,1686 380,1648"/><text class="sm" x="450" y="1644">选择外部动作？</text><text class="e" x="535" y="1634">否</text><text class="e" x="467" y="1702">是</text>
  <path class="l" d="M520 1648H680"/><rect class="n" x="680" y="1622" width="115" height="52"/><text class="sm" x="737" y="1644"><tspan x="737">等待或</tspan><tspan x="737" dy="18">内部记录</tspan></text>

  <rect class="g" x="80" y="1762" width="740" height="486"/><text class="gl" x="98" y="1783">Outbox、通道与可信反馈</text>
  <path class="l" d="M450 1686V1812"/><rect class="s" x="300" y="1812" width="300" height="62"/><text class="t" x="450" y="1838"><tspan x="450">原子写入决策与 Outbox</tspan><tspan class="sm" x="450" dy="21">rendered · queued · sending · lease</tspan></text>
  <path class="l" d="M450 1874V1915"/><rect class="n" x="326" y="1915" width="248" height="58"/><text class="t" x="450" y="1940"><tspan x="450">消息通道执行</tspan><tspan class="sm" x="450" dy="20">按 action_id 回报结果</tspan></text>
  <path class="l" d="M450 1973V2008"/><polygon class="d" points="450,2008 520,2046 450,2084 380,2046"/><text class="sm" x="450" y="2042">真实送达？</text><text class="e" x="354" y="2032">失败/取消</text><text class="e" x="468" y="2100">成功</text>
  <path class="l" d="M380 2046L220 2112"/><rect class="n" x="105" y="2112" width="230" height="58"/><text class="sm" x="220" y="2137"><tspan x="220">Outbox 标记失败或取消</tspan><tspan x="220" dy="19">不改变关系状态</tspan></text>
  <path class="l" d="M450 2084V2112"/><rect class="s" x="345" y="2112" width="210" height="58"/><text class="sm" x="450" y="2137"><tspan x="450">原子写入结果事件</tspan><tspan x="450" dy="19">伪造 ID 被拒绝</tspan></text>
  <path class="l" d="M450 2170V2202"/><rect class="s" x="292" y="2202" width="316" height="64"/><text class="t" x="450" y="2228"><tspan x="450">更新需求、负荷、关系与对话</tspan><tspan class="sm" x="450" dy="21">确认结果形成下一轮人格状态</tspan></text>
  <path class="loop" d="M608 2234C760 2234 834 2160 834 1910V478C834 430 800 408 766 408"/><text class="e" x="824" y="1300" transform="rotate(-90 824 1300)">后台持续运行 / 时间推进 / 冷却后再评估</text>
  <path class="ls" d="M220 2170C220 2290 292 2312 360 2312"/>
</svg>
